<section class="slide" data-title="How it works"
  data-notes="SAY: &quot;Four and a half million hours of federal generation data, seventy grid operators. From it we compute one number for every hour of every region: the carbon-free share of what was actually generated. Three things stand on that index. A detector that scores a hundred and eleven regions for where flat, round-the-clock load is landing, using demand data alone. A siting score for where new load would run cleanest. And the claims layer you just saw.&quot;
  || THE SHAPE IS THE POINT: one data source, one index, three products. A judge should get that in two seconds without reading a label. The left box is the input, the middle box is the thing we built that did not exist, and the fan is what it pays for.
  || DATASET, named here for the public-dataset track. EIA-930 hourly electric grid monitor data, obtained through PUDL, the Public Utility Data Liberation project, using Voloridge's own fetch script (scripts/vendor/pudl_fetch.py). Tables: core_eia930__hourly_net_generation_by_energy_source, core_eia930__hourly_interchange, out_eia930__hourly_operations, out_eia930__hourly_subregion_demand, plus the two code tables. The slide says GRID REGIONS because that is the plain-English word; the unit of record is the BALANCING AUTHORITY, and the raw index is keyed on it. Say 'balancing authority' out loud if a judge is technical - it is the term that proves you know the dataset.
  || THE THREE COUNTS ARE DIFFERENT AND ALL THREE ARE RIGHT. 70 balancing authorities in the raw hourly index. 124 published regions (56 BAs + 68 zones). 111 regions scored by the detector (43 BAs + 68 zones). docs/pitch/numbers.md section 2.4 and trap T16. Never say '70 grid regions' and '111 regions' as if they were the same population; the slide keeps them in different boxes for exactly this reason.
  || FIGURES. 4,451,763 hourly rows and 70 balancing authorities: recomputed from data/processed/hourly_cf_index.parquet, len() and ba.nunique(); docs/pitch/numbers.md section 2.4, which also carries the caveat that these two live in a gitignored local parquet, not in any committed JSON - the published JSON carries the 124 regions built from the rows, not the rows. Date range 2018-07-01 to 2026-09-05 (same file, and api/index.json generated_from.data_snapshot_end). 111 regions scored: api/regions.json meta.n_scored, ranks 1..111 contiguous.
  || THE INDEX. Carbon-free = nuclear + hydro + wind + solar + geothermal, over total generation, per hour, per region. Other and unknown sit in the denominator only; storage is excluded. Overnight is 00:00-05:59 local, daytime 10:00-15:59, baseline year 2019. This is an AVERAGE MIX inside a footprint, not marginal emissions and not consumption - EIA-930 gives fuel and interchange, not dispatch order, and interchange is not allocated.
  || THE DETECTOR, and why it is the slide's strongest box. score = z(overnight_excess) + z(neighbor_divergence) + 0.5*z(load_factor_delta), robust z on median/MAD, regions under 500 MW average demand excluded, peak taken at the 99.5th percentile hour. DEMAND DATA ONLY - it never sees a list of datacenters. The method and the four validation regions were frozen before the ranking was seen (api/regions.json meta.detector_method, meta.validation_named_in_advance = PJM/DOM, PJM/AEP, SWPP/OPPD, ERCO/NCEN). Northern Virginia landed 6th and Omaha 7th; the AEP zone landed 19th and Dallas 91st, and the Dallas miss is published on screen because the whole of ERCOT is booming so Dallas does not diverge from its neighbours. Report the miss - it is the reason to believe the hits.
  || THE SITING SCORE: overnight carbon-free share in 2025, the change since 2019, overnight clean MW over overnight demand, and the 2019-2025 per-year slope of that ratio. 52 balancing authorities ranked (siting.n_ranked). Slope only - no 'years remaining', no nameplate headroom.
  || THE CLAIMS BRANCH is slide 02, and it is the only branch that touches a document. Zones report demand only and inherit their parent BA's generation figures (cf_inherited_from_ba), which is why PJM's +10.74 GW of overnight gas is never Dominion's.
  || WHAT THIS PIPELINE BUYS: nobody publishes the night series. Since 2019 the country added 64.7 GW of clean generation to the average daytime hour and 17.7 GW to the average overnight hour - 3.7 times more to the hours a flat load does not use. Those are the AZPS-corrected figures (README, 'What the data says'); the uncorrected pair is 61.4 / 14.3 and includes a double-counted nuclear plant we caught in the federal data.">

<section class="slide" data-title="Ask it in English"
  data-notes="SAY: &quot;And you can just ask it. That is OpenAI's tool-calling API over eleven typed tools - every one of them reads the same index, so the answer is a table with its sources on it, not a paragraph. One of the tools is retrieval: three hundred and fifty-four passages from these companies' own reports and filings, indexed in Elasticsearch, every hit carrying its page number.&quot;
  || THE SHAPE: a question goes to a model that may only call typed tools; the tools read the same published index the rest of the product reads, plus the document corpus; the answer comes back as a view with provenance. The model is never handed free text to compute over, and the render step is explicitly told it has no tools and may not invent a cell. That is the whole anti-hallucination design and it is worth saying out loud.
  || ELEVEN TOOLS, and the discrepancy you must know before a judge finds it. The LIVE service at /api/ask/status reports ELEVEN: alerts, companies, company, compare_companies, compare_regions, facilities, irradiance, national, rank_regions, region, search_corpus. The copy of server/ai.py in this repo is STALE AT TEN - it is missing compare_companies. The demo runs against the live service, so eleven is what a judge would see. If you are reading from the repo and want a sentence that cannot be made wrong by the next deploy, say 'over ten typed tools' and name search_corpus. Source: docs/narration-annex.md, shot 14 'askhow'. Model is gpt-4.1.
  || 354 PASSAGES, NOT 354 FILINGS. /api/search/status reports indexed = 354 in index wattson-corpus-v1, of which 309 are sustainability-report passages and 45 are from SEC 10-Ks. They are extracted passages from EIGHT source documents across FOUR companies, counted line by line in claims/raw/*.jsonl: Google 118+9, Meta 74+19, Microsoft 66+11, Amazon 51+6. Saying '354 filings' overstates the document count more than fortyfold and is exactly the class of error this project exists to catch. Quality flags: 341 ok, 7 tabular, 6 suspect, and the suspect ones stay visible.
  || ELASTICSEARCH: server/search.py, wired into the ask layer as the search_corpus tool. Every hit carries a page number or an Item locator, which is what makes a claim citable back to the page it came from. The retrieval layer was implemented with Codex; that is the only Codex claim in the film. NOTE: README's track table still says no cluster is provisioned - that is stale; /api/search/status is live and reports 354. Check the endpoint before you say it on stage.
  || COVERAGE, said out loud because it is a gap and not a finding: we hold 52 operators and 134 mapped sites (api/companies.json count = 52, api/facilities.json count = 134), and we have read documents for FOUR of them. The other 48 are sites-only, each carrying its own printed reason (claims_absent_reason = no_documents_ingested). Do not round 48 down.
  || THE SITE IS A STATIC EXPORT. Every endpoint is baked to JSON (python -m server --static-export), so the demo needs no server and no network. If the ask layer is down, the command palette degrades to a deterministic set of prepared queries. Say so rather than clicking into a spinner.">
