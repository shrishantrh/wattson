<!-- 02 · THE SOLUTION · what we built, in one sentence a stranger can repeat.
     Visible words: 15 (headline 10 + GOOGLE, SAYS, 100%, MEASURED, 46%).
     Colour: the claim bar is NEUTRAL INK on purpose - a claim is not generation, so it is
     neither --clean nor --fossil. Only the right-hand bar is a measurement, and it is the
     only thing on this slide entitled to the signal hues. -->

<section class="slide" data-title="What we built"
  data-notes="SAY: &quot;Wattson takes a company's public clean-power claim, finds the buildings that company actually operates, finds the grid serving each one, reads what that grid physically generated hour by hour, and puts the claim and the measurement side by side.&quot; Then the picture: &quot;Google's report, page four: one hundred percent. The ten buildings we mapped sit on grids that generated forty-six percent carbon-free last year. Fifty-four points apart.&quot;
  || THE PICTURE, left to right, is the product: a document, ten buildings, an hour ruler, a measured bar. The ten identical building marks are the ten mapped Google sites; the twenty-four identical ticks are the hours in a day. Both are deliberately UNIFORM so neither can be misread as a data series - nothing in the middle of this slide is a measurement, it is the mechanism.
  || FIGURES, all from web/public/api/company/GOOGL.json, which is what the live site serves. Claimed 100%: claims[0].magnitude = 1.0, page 4, timeframe annual, scope market_based, verdict true_on_paper. Measured 46%: claims[0].physical_mean_unweighted = 0.464. Ten buildings: sites array length 10. The on-screen gap of 54 points is 100 minus 46.4, and it is rendered in the product's own gap block (docs/narration-annex.md shot 6 'grids', and its figure table row '54 points apart (on screen)').
  || SUPERSEDED - DO NOT USE THE OLD PAIR. docs/pitch/numbers.md section 2.6 still shows Google as 5.6% across 1 site, a 94-point gap. That was one site on Santee Cooper and it was superseded by the merge; docs/narration-annex.md lists 'Six percent physically for Google, and 94 points apart' under 'Figures deliberately not spoken'. The live file now carries 10 sites and 0.464. If a judge quotes 5.6%, that is Moncks Corner alone (claims[0].physical_min 0.056); the range across the ten is 6-91% (physical_max 0.913, The Dalles on BPAT).
  || THE CAVEATS, in the order they will be asked for. (1) 46.4% is an UNWEIGHTED mean of the carbon-free share of generation inside each site's grid region in calendar 2025, all hours. We do not know each building's load, so we do not weight it, and we say so. (2) It is GRID-ONLY: it excludes power purchase agreements and renewable energy certificates, which is exactly the accounting the 100% is built on. (3) It is GENERATION INSIDE A FOOTPRINT, not consumption at a meter. Interchange is not allocated. (4) Average mix, not marginal.
  || NEVER SAY GOOGLE LIED. The claim is true under the GHG Protocol market-based method and the product renders the verdict as true_on_paper. The sentence is 'true on paper, forty-six percent physically'. The point is not deceit, it is that a contract and a grid are two different things, and only one of them was being measured. If you want the sharpest honest line, it is Google's own: the same report discloses 65% hourly carbon-free on page 94, ninety pages after the 100% on page 4 (claims[0].evidence, type internal_contradiction, values [65,64,64,66,65] for 2021-2025).
  || DATASET, for the public-data track: EIA-930 hourly operating data, obtained through PUDL (Public Utility Data Liberation), 4,451,763 hourly rows across 70 balancing authorities, July 2018 to 2026-09-05. 'Grid region' on the slide is the plain-English word; 'balancing authority' is the term of art and the unit the raw table is keyed on. Slide 03 draws the pipeline.">
