<section class="slide" data-title="Built on" data-notes="The stack, left to right, and it is one pipe. Federal hourly data: EIA-930 pulled through PUDL with Voloridge's own fetch script, 4.45 million hourly rows across 70 balancing authorities, 2018-07-01 to the 2026-09-05 snapshot (numbers.md 2.4: 4,451,763 rows recounted from data/processed/hourly_cf_index.parquet; 70 from ba.nunique(); that parquet is gitignored, so the honest answer if a judge asks for the field is 'it is the row count of the L1 index; the published JSON carries the 124 regions built from it'). A Python engine turns those rows into an hourly carbon-free index and scores 111 regions with the frozen detector, then bakes every API endpoint to JSON (numbers.md 2.3: 111 regions, ranks 1..111 contiguous, 43 BAs plus 68 zones). A React front end: the map is a globe drawn as an instanced dot field, one instance per point, so the whole US region set animates without redrawing geometry. An OpenAI tool-calling layer sits over typed tools rather than RAG over a blob, so every number the answer prints is traceable to a call. ELEVEN tools, on gpt-4.1: alerts, companies, company, compare_companies, compare_regions, facilities, irradiance, national, rank_regions, region, search_corpus. SOURCE, AND DO NOT RE-LITIGATE IT: the deployed API's status endpoint, queried live on 2026-09-20, which returns those eleven names. The repo copy of server/ai.py lists only ten (it is missing compare_companies) and the README also says ten; both are stale, and the demo runs against the live service, so eleven is what a judge would see. Elasticsearch retrieval backs search_corpus and it is LIVE: the search status endpoint reports index wattson-corpus-v1 holding 354 documents, 309 from the four sustainability reports and 45 from the four 10-Ks, quality split 341 clean, 7 tabular, 6 suspect; a real query against Microsoft's report returns real passages with page or Item locators. The README's 'no cluster provisioned' line is out of date; do not disclaim Elastic on stage, it is a sponsor track. The 354 also reconciles with the corpus on disk: wc -l over claims/raw/*.jsonl gives 6+51+9+118+19+74+11+66 = 354 across 8 files, four ESG reports and four annual filings (numbers-v2.md records the same breakdown; numbers.md 3 had listed '354 chunks' as unchecked prose, and it is now checked twice, on disk and in the index). FOR THE OPENAI TRACK, the strongest single line: the Elasticsearch retrieval layer was written by Codex - that is the concrete way Codex improved the process. And the whole site is a static export: server/__main__.py --static-export bakes every endpoint, web/dist needs no server, no Python and no network, which is also the demo's failure plan.">
