<section class="slide" data-title="No watchdog"
  data-notes="SPOKEN: &quot;Fast fashion has watchdogs. Airlines have watchdogs. Datacenters have none - and every forecast says they&#39;re growing fastest.&quot;

HANDS OFF THE LAPTOP. The list does the work. By the third tick the judge has accepted that auditing an industry&#39;s environmental promises is a normal, mature thing that obviously exists. The empty box then lands as an oversight, not as a pitch. The absence is the picture, and the next slide says why the absence survived.

WORD CHOICE, deliberate. Say &quot;every forecast says they&#39;re growing fastest&quot;, not &quot;the fastest-growing industrial load in America&quot;. The superlative is in neither numbers file; attributing it costs two words and cannot be attacked.

WHAT IS AND ISN&#39;T CLAIMED: every operator building AI datacenters publishes a clean-power promise. We are not saying any of them lied. A promise that matches a year of clean power against a year of use is genuinely true under the accounting standard (the GHG Protocol market-based method - say &quot;the accounting standard&quot; out loud, name the standard only if a judge asks). We are saying nobody has ever settled those promises against what the grid physically generated, hour by hour.

SCALE WE HOLD, if asked: 52 operators and 134 mapped buildings; documents read for 4 of them (META, MSFT, GOOGL, AMZN), 48 buildings-only, and every buildings-only row prints its own reason (claims_absent_reason: no_documents_ingested). Source: api/companies.json count=52, count_with_claims=4, count_sites_only=48; api/facilities.json count=134. numbers-v2.md 2.5. Do NOT say twelve operators, that was a stale string (numbers-v2.md X1).

Evidence base: 4.45M hourly rows (4,451,763), 70 grid regions, 2018-07-01 to 2026-09-05. numbers.md 2.4. Say &quot;grid region&quot;; the term of art is &quot;balancing authority&quot; and it is worth naming once, to a technical judge, right after the plain word - never instead of it.

The three ticked industries are context, not our measurements. Do not put a number on them.">

<section class="slide" data-title="Annual vs hourly"
  data-notes="SPOKEN: &quot;Nobody has checked, because of how the promise is written: a year of clean power bought against a year of use. It balances.&quot;

THE ONE GLOSS THAT MUST BE SPOKEN HERE, because &quot;true on paper&quot; is used for the rest of the talk and this is where it is earned: a company buys certificates for a year&#39;s worth of clean power to match a year&#39;s worth of use. Add the year up and the two sides cancel. That is a real accounting standard - the GHG Protocol market-based method - and the claim is genuinely true under it. At yearly resolution there is nothing to see. You have to separate the hours.

THE PICTURE: left is the year as the promise reports it, one block, fully matched. Right is the same year split into hours. The megawatt-hours are identical. Only the resolution changed, and a gap appears.

NEVER say a company lied. The verdict language is: true on paper, X percent physically. We are measuring the gap between a contract and a meter, not accusing anyone of fraud. CLAUDE.md honesty rules.

CAVEAT to have ready: we measure power generated inside a grid region, not power consumed at a building. Imports and exports are not traced through. It is the average mix of the region, not the specific plant that fires up when a datacenter switches on - which, if anything, understates us. EIA-930 gives fuel and interchange, not dispatch order. numbers.md T6, T17.

The hourly bars here are illustrative of the mechanism, not a plot of a specific region. The real hourly series is on the following slides and in the product. Do not read a number off this one.

Worked example available if pressed: Alphabet claims 100% (report p.4, annual, market-based); across the ten mapped Google buildings the grids physically generated 46% clean in 2025. A 54-point gap, and the verdict field still reads true_on_paper, so the phrasing does not change. Source: api/company/GOOGL.json claims[0].physical_mean_unweighted = 0.464, walk_score 0.464, verdict true_on_paper. Traced in numbers.md, Correction 2026-09-20: the Google headline pair.

CARRY THE RANGE, NOT ONE BUILDING: physical_min 0.056, physical_max 0.913. One Google building sits on a grid that was 5.6% clean and another on one that was 91.3%. That is the answer to the objection that this rests on a single place, and it is direct evidence the method distinguishes rather than prosecutes. Never quote 5.6% alone as Google&#39;s figure, it is one end of a range; the 100 against 5.6 pair (94 points, one building) is SUPERSEDED and must not be spoken. Google&#39;s own report puts hourly clean supply at 65% on p.94.">

<section class="slide" data-title="Added since 2019"
  data-notes="SPOKEN: &quot;Nobody looks inside the hours. Since 2019 America added sixty-five reactors&#39; worth of clean power to its midday hours - eighteen reactors&#39; worth to its three-a.m. hours.&quot; Then, without clicking: &quot;Solar fixed the daytime. A datacenter draws the same power at three in the morning as at noon - hours that never improved.&quot;

WHY REACTORS AND NOT GIGAWATTS. A large nuclear reactor is about one gigawatt, so +64.7 GW and +17.7 GW are about sixty-five and eighteen reactors&#39; worth. Same fact, and it lands on a judge who has no feel for a gigawatt. UNDERSTAND.md section 3, step 2. The slide still prints the gigawatts, so nothing is hidden.

READ THE BARS RIGHT. These are megawatts of clean generation ADDED since 2019, both positive, not levels and not shares. The levels are 239.5 GW midday and 173.4 GW overnight, a ratio of only 1.4. If anyone reads 64.7 and 17.7 as levels the slide is misleading, so the words clean power added since 2019 are on the slide itself.

FIGURES AND SOURCE: numbers-v2.md, Addendum: the corrected-baseline headline pair. That addendum is the traceable source for both bars and records the arithmetic field by field. Corrected pair, the one to use: +64,738 MW midday, +17,687 MW overnight, ratio 3.66x. Published-baseline pair, do not use: +61,404 / +14,349, 4.28x. Underlying fields: api/regions.json meta.national.cf_avg_mw (2019 midday 178,129, overnight 159,031; 2025 midday 239,533, overnight 173,380), an absolute megawatt average per hour-class, national sum, generation not demand; minus the Arizona phantom from api/region/AZPS.json region.corrections.corrections[] at path cf_avg_mw.2019 (3,334 MW midday, 3,338 MW overnight), giving a corrected 2019 baseline of 174.8 GW midday and 155.7 GW overnight. Baseline year 2019, latest complete year 2025. Windows are 10:00-15:59 and 00:00-05:59 local time where the power is: 3am in Texas is not 3am in Maine.

WHY THE CORRECTED BASELINE: the published 2019 figures count one power plant twice, and we found it in the federal record. Palo Verde was reported in full by two owners at once until 2019-12-04. Removing that phantom lowers the 2019 starting point and widens both gaps. numbers.md D1, confidence tier proven. Say &quot;a double count we caught&quot;, never &quot;it collapsed&quot;. The slide two from the end is where you tell that story.

THE SHARE DID NOT FALL. This is the house trap and the one way to say something false out of true numbers. Overnight clean share was 39.7% in 2019 and 39.7% in 2025 - flat. Clean megawatts at night ROSE, by 17.7 GW; demand simply rose faster. Never state a share without the absolute in the same breath, and never say clean power at night shrank. UNDERSTAND.md section 4; numbers.md T8; numbers-v2.md N1 and N2.

THE FLAT LINE is the datacenter load, drawn at one height across both bars. It is the picture of a building that draws the same power at 3am as at noon. Illustrative, not a measured series.

WHERE IT GOES NEXT, the question they should now want answered: which grid is a given company&#39;s building actually on at 3am. PJM, the grid serving the largest datacenter cluster on earth, generates 8.7 GW more power at night than it did in 2019, and not one net megawatt of that increase is clean - clean generation fell 81 MW while gas supplied 10.74 GW. api/region/PJM.json total_avg_mw, cf_avg_mw, fuel_delta_overnight_gw.gas. numbers.md 2.1.">
