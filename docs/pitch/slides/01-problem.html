<section class="slide" data-title="No watchdog"
  data-notes="SPOKEN, taken word for word from docs/DEMO.md section 1 so the slide and the demo cannot drift: &quot;There is a greenwashing watchdog for fast fashion. For airlines. For oil majors. There isn&#39;t one for datacenters, the fastest growing user of electricity in America. So we built one.&quot;

ONE CAUTION ON THAT SENTENCE. &#39;The fastest growing user of electricity in America&#39; is a superlative that is in neither numbers file. If a judge challenges it, do not defend it - say &quot;every forecast says they&#39;re growing fastest&quot; and move on. Nothing else in the talk rests on it.

HANDS OFF THE LAPTOP. The list does the work. By the third tick the judge has accepted that auditing an industry&#39;s environmental promises is a normal, mature thing that obviously exists. The empty box lands as an oversight, not as a pitch. Then &#39;So we built one&#39; turns it in four words, which is why those words are now ON the slide rather than only in your mouth.

THE SECOND HALF OF THE OPENING, still on this slide, still hands off the laptop (DEMO.md section 1): &quot;And these companies are careful. They don&#39;t say they run on clean power. Google says it MATCHED 100% of its consumption with renewable PURCHASES, on an ANNUAL basis. That&#39;s an accounting statement, and it&#39;s true. Nobody has checked the physical one.&quot; Never paraphrase that quote as &#39;100% renewable&#39; (DEMO.md, &#39;Have these four cold&#39;, item 1).

WHAT IS AND ISN&#39;T CLAIMED: every operator building AI datacenters publishes a clean-power promise. We are not saying any of them lied. A promise that matches a year of clean power against a year of use is genuinely true under the accounting standard (the GHG Protocol market-based method - say &quot;the accounting standard&quot; out loud, name the standard only if a judge asks). We are saying nobody has ever settled those promises against what the grid physically generated, hour by hour.

SCALE WE HOLD, if asked: 52 operators and 134 mapped buildings; documents read for 4 of them (META, MSFT, GOOGL, AMZN), 48 buildings-only, and every buildings-only row prints its own reason (claims_absent_reason: no_documents_ingested). Source: api/companies.json count=52, count_with_claims=4, count_sites_only=48; api/facilities.json count=134. numbers-v2.md 2.5. Do NOT say twelve operators, that was a stale string (numbers-v2.md X1). The demo shows this live on the NBIS lookup (DEMO.md section 5) and says it in the right words: &quot;a statement about OUR coverage, not a finding about them&quot;.

Evidence base: 4.45M hourly rows (4,451,763), 70 grid regions, 2018-07-01 to 2026-09-05. numbers.md 2.4. Say &quot;grid region&quot;; the term of art is &quot;balancing authority&quot; and it is worth naming once, to a technical judge, right after the plain word - never instead of it.

The three ticked industries are context, not our measurements. Do not put a number on them.

VISIBLE WORDS: 15. Greenwashing watchdogs (2) + Fast fashion Airlines Oil majors Datacenters (6) + None for datacenters. So we built one. (7).">

<section class="slide" data-title="Added since 2019"
  data-notes="SPOKEN: &quot;Since 2019 America added sixty-five reactors&#39; worth of clean power to its midday hours - eighteen reactors&#39; worth to its three-a.m. hours.&quot; Then, without clicking: &quot;Solar fixed the daytime. A datacenter draws the same power at three in the morning as at noon - hours that never improved.&quot; Then go to the site.

THIS IS THE ONE PICTURE THE LIVE DEMO CANNOT DRAW, which is why it survived the cut. Everything after it happens on the screen.

THE SAME FACT AT ONE GRID, and it is the better sentence - take it from docs/DEMO.md section 2 and say it on the site, with the Night and Day columns next to each other: &quot;This is Las Vegas. Fifty-six percent of its power is carbon-free at midday. ONE POINT EIGHT PERCENT at three in the morning. Same grid, same year, ten hours apart.&quot; Then: &quot;A datacenter buys both, equally, because it never stops.&quot; Figures: NEVP 2025, daytime cf_share 0.558, overnight cf_share 0.018, from web/public/api/region/NEVP.json (checked live 2026-09-20). NOTE FOR THE RECORD: this pair is not yet written into numbers.md or numbers-v2.md - it is read from the API, which numbers.md&#39;s own rule makes the authority. Do not put it on a slide until it is traced there.

WHY REACTORS AND NOT GIGAWATTS. A large nuclear reactor is about one gigawatt, so +64.7 GW and +17.7 GW are about sixty-five and eighteen reactors&#39; worth. Same fact, and it lands on a judge who has no feel for a gigawatt. UNDERSTAND.md section 3, step 2. The slide still prints the gigawatts, so nothing is hidden.

READ THE BARS RIGHT. These are megawatts of clean generation ADDED since 2019, both positive, not levels and not shares. The levels are 239.5 GW midday and 173.4 GW overnight, a ratio of only 1.4. If anyone reads 64.7 and 17.7 as levels the slide is misleading, so the words clean power added since 2019 are on the slide itself.

FIGURES AND SOURCE: numbers-v2.md, Addendum: the corrected-baseline headline pair. That addendum is the traceable source for both bars and records the arithmetic field by field. Corrected pair, the one to use: +64,738 MW midday, +17,687 MW overnight, ratio 3.66x. Published-baseline pair, do not use: +61,404 / +14,349, 4.28x. Underlying fields: api/regions.json meta.national.cf_avg_mw (2019 midday 178,129, overnight 159,031; 2025 midday 239,533, overnight 173,380), an absolute megawatt average per hour-class, national sum, generation not demand; minus the Arizona phantom from api/region/AZPS.json region.corrections.corrections[] at path cf_avg_mw.2019 (3,334 MW midday, 3,338 MW overnight), giving a corrected 2019 baseline of 174.8 GW midday and 155.7 GW overnight. Baseline year 2019, latest complete year 2025. Windows are 10:00-15:59 and 00:00-05:59 local time where the power is: 3am in Texas is not 3am in Maine.

WHY THE CORRECTED BASELINE: the published 2019 figures count one power plant twice, and we found it in the federal record. Palo Verde was reported in full by two owners at once until 2019-12-04. Removing that phantom lowers the 2019 starting point and widens both gaps. numbers.md D1, confidence tier proven. Say &quot;a double count we caught&quot;, never &quot;it collapsed&quot;. The demo closes on that story (DEMO.md section 13): combined they reported 1.91 times what the plant can physically produce.

THE SHARE DID NOT FALL. This is the house trap and the one way to say something false out of true numbers. Overnight clean share was 39.7% in 2019 and 39.7% in 2025 - flat. Clean megawatts at night ROSE, by 17.7 GW; demand simply rose faster. Never state a share without the absolute in the same breath. The demo has the sharpest version of this rule, on the PJM/DOM page with CLEAN MW toggled on (DEMO.md section 4): &quot;The share fell, but clean output barely moved, 35,700 to 35,619 megawatts. No clean power was lost. The share fell because everything else in those hours grew around it. If you only quote the share, you say something false using true numbers.&quot; UNDERSTAND.md section 4; numbers.md T8; numbers-v2.md N1 and N2.

THE FLAT LINE is the datacenter load, drawn at one height across both bars. It is the picture of a building that draws the same power at 3am as at noon. Illustrative, not a measured series.

WHERE IT GOES NEXT: press on to the holding slide and open the site. The first screen is Data → Regions, with Night and Day adjacent, and NEVP is the row you want.
