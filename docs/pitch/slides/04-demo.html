THE URL IS ON THE SLIDE so a judge can open it on their own laptop while you talk: shrishantrh.github.io/wattson . Open the site before you start and leave it on the landing page. If the first Command-K question is slow, that is the API waking up and it takes about three seconds once - do not apologise.

THE FOUR LINES TO HAVE COLD (DEMO.md, &#39;Have these four cold&#39;):
1. The claim quote: &quot;Matched 100% of our electricity consumption with renewable energy purchases, on a global and annual basis.&quot; NEVER paraphrase it as &#39;100% renewable&#39;.
2. NEVP: 1.8% clean at night, 55.8% by day, 2025. Two columns, one row, no method required. api/region/NEVP.json cf_share.2025 overnight 0.018 / daytime 0.558.
3. Dallas came 91st. Volunteer it before anyone asks.
4. 1.91 times the nameplate - the federal data error, confirmed three ways.

THE ONE DISCREPANCY TO CARRY, not to adopt silently: DEMO.md section 7 says eleven of our sites make their own power and never touch the grid. Our fact-check could only reproduce ten site notes saying so. SAY &#39;ABOUT A DOZEN&#39;. The point is undamaged either way, and it is the strongest limit we volunteer: a demand-only detector cannot see a datacenter that brought its own power plant.

WHAT THE STRIP ON THE SLIDE IS FOR: a judge scoring public-dataset use will read it, and this slide is up longer than any other. EIA-930, the federal hourly grid data, pulled through PUDL - the Public Utility Data Liberation project. 4,451,763 hourly rows, 70 grid regions (the term of art is balancing authority; say it once, after the plain word), 2018-07-01 to 2026-09-05. numbers.md 2.4. 52 operators and 134 mapped sites: api/companies.json count=52, api/facilities.json count=134, numbers-v2.md 2.5.
