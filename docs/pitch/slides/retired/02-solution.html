<section class="slide" data-title="What we built"
  data-notes="SAY: &quot;So we built the watchdog. It takes the claim, finds the buildings, finds the grid under each, and reads what that grid generated, hour by hour.&quot; If you have a spare beat, the picture in one line: &quot;Google&#39;s report, page four: a hundred percent. The ten buildings we mapped sit on grids that generated forty-six percent clean power last year.&quot;
  || THE PICTURE, left to right, IS the product: a document, ten buildings, a ruler of hours, a measured bar. The ten identical building marks are the ten mapped Google buildings; the twenty-four identical ticks are the hours in a day. Both are deliberately UNIFORM so neither can be misread as a data series - nothing in the middle of this slide is a measurement, it is the mechanism.
  || THE NAME OF THE NUMBER, used the same way everywhere from here on: CLEAN SHARE - of all the electricity generated in one region in one hour, the fraction from sources that burn nothing (nuclear, hydro, wind, solar, geothermal). Spoken, it is &quot;how much of the power was clean&quot;. In the JSON it is carbon-free share, cf_share, walk_score; on stage it is one phrase, because three names for one number is its own kind of dishonesty.
  || FIGURES, all from web/public/api/company/GOOGL.json, which is what the live site serves. Claimed 100%: claims[0].magnitude = 1.0, page 4, timeframe annual, scope market_based, verdict true_on_paper. Measured 46%: claims[0].physical_mean_unweighted = 0.464. Ten buildings: sites array length 10. The on-screen gap of 54 points is 100 minus 46.4, and it is rendered in the product&#39;s own gap block (docs/narration-annex.md shot 6 &#39;grids&#39;).
  || SUPERSEDED - DO NOT USE THE OLD PAIR. docs/pitch/numbers.md section 2.6 still shows Google as 5.6% across 1 building, a 94-point gap. That was one building on Santee Cooper and it was superseded by the merge. The live file now carries 10 buildings and 0.464. If a judge quotes 5.6%, that is Moncks Corner alone (claims[0].physical_min 0.056); the range across the ten is 6-91% (physical_max 0.913, The Dalles).
  || WALK SCORE, said plainly if asked how 46% is built: it is the plain average of how clean every grid those ten buildings sit on actually was, in calendar 2025, all hours. No contracts, no certificates, and no weighting by building size - we do not know each building&#39;s load, so we do not pretend to, and one very large building could move it. UNDERSTAND.md section 4 prints the ten values in full. TALK SCORE, the other axis: how bold the claim is - how big the number, how precisely stated, how little hedged. Google&#39;s is 0.405; &#39;100% renewable&#39; scores high on size and precision and then loses ground because the claim is annual, and averaging over a year is exactly what hides the night.
  || THE CAVEATS, in the order they will be asked for. (1) It is GRID-ONLY: it leaves out power purchase agreements and certificates, which is exactly the accounting the 100% is built on. (2) It is what was GENERATED INSIDE A REGION, not what a building consumed; imports are not traced through. (3) Average mix, not the specific plant that fires up - which if anything understates us.
  || NEVER SAY GOOGLE LIED. The claim is true under the accounting standard and the product renders the verdict as true_on_paper. The sentence is &#39;true on paper, forty-six percent physically&#39;. The point is not deceit, it is that a contract and a grid are two different things and only one of them was being measured. The sharpest honest line is Google&#39;s own: the same report discloses 65% clean power hour by hour on page 94, ninety pages after the 100% on page 4 (claims[0].evidence, type internal_contradiction, values [65,64,64,66,65] for 2021-2025).
  || DATASET, for the public-data track: EIA-930 hourly grid data, obtained through PUDL (Public Utility Data Liberation), 4,451,763 hourly rows across 70 grid regions, July 2018 to 2026-09-05. &#39;Grid region&#39; is the plain word; &#39;balancing authority&#39; is the term of art and the unit the raw table is keyed on - name it once to a technical judge, after the plain word. Slide 03 draws the pipeline.">
