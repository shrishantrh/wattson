<section class="slide" data-title="Close" data-notes="Wattson. It follows the power, not the press release. The reason this matters past a hackathon: every verdict ends at a named utility in a named region, so it is not only an expose — someone can act on it. Google's Moncks Corner site sits on Santee Cooper, which generated 5.6% carbon-free in 2025 against a 100% annual market-based claim; OpenAI's Santa Teresa campus sits on El Paso Electric, 34.1% carbon-free at midday and 0.1% at night, one megawatt of clean generation out of 655; Vantage's Quincy site sits on Grant County PUD at 100.0% overnight, all Columbia River hydro. The chain is always the same: claim, site, serving utility, balancing authority, hour. 107 of our 134 sites have an established serving utility; 42 of those 107 are public power, co-ops or state authorities with no listed equity, and we count the 27 unresolved separately so they cannot inflate the number. Never say a company lied: annual matched claims are true under the GHG Protocol market-based method, and the verdict is 'true on paper, X physically'. We measure generation inside a footprint, not consumption, and interchange is not allocated. Who built what: Shri built the grid engine and the interface — the L0 to L4 pipeline, the carbon-free index, the flat-load detector, the siting score, the fuel decomposition, the export and alerts, and the front end. Yash built the investigation layer — the claims pipeline, document ingestion and extraction, the company verdict schema, the facility-to-utility lookup, the API, the ask layer and the reproducibility run. The company-card JSON schema was agreed before either side built against it, which is what let the halves join. Figures: numbers.md §2.6 (Google 100% claimed, 5.6% physical, Santee Cooper, and the caveat that must travel with 0.056), numbers-v2.md §2.2 (EPE 0.341 day, 0.001 night, 1 MW of 655), §2.3 and §2.6 (Grant County 1.000, Vantage Quincy), §2.5 (134 sites, 107 resolved, 42 no listed equity, 27 unresolved); README, Who built what.">
