WHY THAT LAST CLAIM MATTERS past a hackathon: every verdict ends somewhere a person can act. Google&#39;s Moncks Corner building sits on a grid that generated 5.6% clean power in 2025 against a 100% annual claim. OpenAI&#39;s Santa Teresa campus sits on El Paso Electric: about a third clean at midday and one megawatt out of 655 at night. Vantage&#39;s Quincy building sits on Grant County PUD, which ran fully clean overnight - all Columbia River hydro. The chain is always the same: claim, building, serving utility, grid region, hour. That is a journalist&#39;s lead, a regulator&#39;s docket and an asset manager&#39;s screen, because rising load hits a regulated utility long before it shows up in a filing.

COVERAGE: 107 of our 134 buildings have a serving utility we could establish; 42 of those 107 are public power, co-ops or state authorities with no listed equity, and the 27 unresolved are counted separately so they cannot inflate the number. Which grid a building draws from is NOT a map lookup, and the example to give is IREN&#39;s datacenter in Childress, Texas: the counties around it are served by the SPP grid, and it wires straight into ERCOT instead. Naive geography gets it wrong and one wrong row flips a verdict.

NEVER SAY A COMPANY LIED. A claim that matches a year of clean power against a year of use is true under the accounting standard, and the verdict we print is &#39;true on paper, X physically&#39;. We measure what a region generated, not what a building consumed, and imports are not traced through.

THE LIMITS, volunteered rather than extracted. Average mix, not the specific plant that fires up - which is usually dirtier, so we likely understate. Regions are coarse: PJM is one number from Chicago to New Jersey. Round-the-clock load is not only datacenters; crypto and oilfield electrification look identical, and our rank 2 is probably the Permian oilfield. About a dozen buildings make their own power behind the meter and the federal data cannot see them (ten site notes use those words, fifteen describe on-site generation of some kind - say &#39;about a dozen&#39;, never &#39;eleven&#39;, which is not reproducible from any field; numbers-v2.md X4). Below the top ten the ranking is not an ordering - the median rank interval is 29 places wide, so treat the top ten as a set. And region size predicts our labels better than load shape does, which we report rather than bury.

WHO BUILT WHAT: Shri built the grid engine and the interface - the pipeline, the hourly clean-share index, the detector, the siting score, the fuel decomposition, the export and alerts, and the front end. Yash built the investigation layer - the claims pipeline, document ingestion and extraction, the company verdict schema, the building-to-utility lookup, the API, the ask layer and the reproducibility run. The company-card JSON schema was agreed before either side built against it, which is what let the halves join.
