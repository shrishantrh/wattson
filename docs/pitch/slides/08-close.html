WHY THERE IS NO THIRD LINE ON THE WALL. The old close carried &#39;Always a named utility&#39; under the tagline, which meant nothing to anyone who had not heard the talk. What it was trying to say is better said on the screen a minute earlier, on the Facilities table and the alpha page: every flagged region resolves to the utility, the parent and the ticker, and a third of the load we found sits on public power and cooperatives with no listed equity at all - that number is on the screen. DEMO.md sections 3 and 12. It is an input to a trade, not a trade; no backtest, and we do not claim one.

THE FEDERAL-DATA ERROR, in full, if a judge picks it up: Palo Verde is the only nuclear station in Arizona and is jointly owned - Arizona Public Service 29.1%, Salt River Project 17.5%. Both reported the WHOLE plant rather than their share, until 2019-12-04. Three confirmations: the two reports match hour for hour (r = 0.9948 across 7,976 hours, identical within 5 MW in 98.8% of them, then a step); at its peak hour the two together reported 8,041 MW from a plant whose nameplate is 4,209.6 MW, 1.91 times what it can physically produce; and the smokestacks agree - Arizona&#39;s fossil generation stayed flat at about 2,040 MW and its CO2 fell 17.5%, and a clean fleet that size cannot vanish without carbon appearing. Corrected like for like, Phoenix ROSE from 2% to 10%: the published figure was wrong in DIRECTION, not only in size. Never say &#39;it collapsed&#39;; say &#39;a double count we caught&#39;. We use the corrected number even though it makes our own headline smaller. numbers.md D1, D2, T2 and the Palo Verde capacity correction of 2026-09-20; UNDERSTAND.md section 6.

THE OTHER THING WE REFUSE TO SAY, if there is a beat for it: 48 of our 52 operators have no documents read, and every one of those records prints its own reason rather than a blank. That is our coverage gap, not a finding about them. The demo shows it live on NBIS (DEMO.md section 5). numbers-v2.md 2.5, X1.
