<section class="slide" data-title="Pre-registered" data-notes="How do you know we didn't tune this until it agreed with us? Because we wrote the method down first and named the test regions out loud. The detector's weights, the 500 MW exclusion and the peak definition (99.5th percentile hour) were all fixed before any ranking was seen, and four regions were named in advance so the method could fail in public: PJM/DOM, SWPP/OPPD, PJM/AEP and ERCO/NCEN (api/regions.json meta.validation_named_in_advance, numbers.md §2.3). Two landed where we said: Northern Virginia 6th of 111 (score 7.71) and Omaha 7th (6.82). Two did not: the AEP zone came 19th (2.29) and Dallas came 91st, with a negative score of -1.32 — because the whole of ERCOT is booming, so Dallas does not diverge from its neighbours. Both misses are on the screen next to the hits; we say two and two. Method string, frozen: score = z(overnight_excess) + z(neighbor_divergence) + 0.5 z(load_factor_delta), robust z, 500 MW cut, p99.5 peak (api/regions.json meta.detector_method). Robust z means median and median absolute deviation rather than mean and standard deviation, so a handful of very large regions cannot drag the score around. The 500 MW cut holds in the output: 13 regions unranked, the largest excluded is IID at 434 MW and the smallest ranked is TPWR at 518 MW. Demand data only — no generation, no company data, no site list went into this ranking. Figures: numbers.md §2.3 (111 regions, ranks 6/7/19/91, scores, the 500 MW cut) and trap T15.">

<section class="slide" data-title="What we print" data-notes="Two more things that make the result credible. First: we found an error in the federal record and we show it rather than quietly fixing it. Arizona Public Service's published 2019 overnight carbon-free share is 0.620; corrected it is 0.017. Palo Verde, the only nuclear station in Arizona, was reported by AZPS and SRP at the same time until a step on 2019-12-04 — correlation 0.9948 over 7,976 hours, identical within 5 MW in 98.8% of them, and 7,087 MW combined against a 3,937 MW nameplate. Confidence tier: proven. What that means for the story: Phoenix did not collapse from 62% to 10%. Like-for-like, Phoenix rose from 2% to 10%. Its level is still low, its direction was wrong in the federal file, and the product shows published and corrected side by side with the correction applied at serve time (siting score 0.173 published, 0.449 corrected; rank 49 to about 32, plus or minus 2). Never say 'it collapsed'; say 'a double count we caught'. Second: what the product refuses to say. We hold 52 operators and 134 sites, and we have read documents for four of them. The other 48 are mapped to grids with nothing of their own held against them, and every one of those records carries its own printed reason, claims_absent_reason 'no_documents_ingested'. That is our coverage gap, not a finding about those companies. Same rule inside the four we did read: 10 claims, 9 true on paper, 1 cannot_verify — Amazon's report has no falsifiable sentence we could extract, so talk_score is null, rendered as a phrase and never as a zero, and the cannot-verify count is on screen. Figures: numbers.md D1 and trap T2 (0.620 published, 0.017 corrected, 0.104 in 2025, r = 0.9948, 7,976 hours, 7,087 vs 3,937 MW), D2 (siting 0.173 to 0.449), §2.6 (10 claims, 9 true on paper, 1 cannot_verify, talk_score null); numbers-v2.md X1 and §2.5 (52 operators, 134 sites, 4 with claims read, 48 sites-only with a printed reason).">
