<section class="slide" data-title="The chain"
  data-notes="SPOKEN, from docs/DEMO.md Part Three: &quot;A datacenter is a billion-dollar electricity customer that nobody announces. The operator doesn&#39;t say which utility serves it. The utility often can&#39;t say either. It surfaces in an earnings call months later. But it cannot hide from the meter. The moment that load energises, it is in federal data within two hours. So every region we flag resolves to the utility that delivers the power, that utility&#39;s parent company, and a ticker. Northern Virginia is rank six. Overnight demand up thirty-nine percent. Utility: Virginia Electric and Power. Parent: Dominion Energy, ticker D. That is a data point about Dominion that came out of a power meter, not out of Dominion.&quot;

THEN THE CLOSE, and land it without hedging: &quot;Three people use this. A journalist or a regulator gets every claim with a page citation, next to what the grid actually generated. Whoever is building the next datacenter gets a ranking of where clean power actually exists at three in the morning, which is the hour that decides whether they&#39;re served by existing clean capacity or by new gas. And an investor gets a billion-dollar event in public data, two hours after it happens.&quot;

DO NOT ADD A DISCLAIMER HERE. The demo script is explicit: do not mention lying, backtests or coverage gaps at the close. If they want the limits they will ask, and you have them.

FIGURES. Rank 6 of 111 and +39% overnight demand growth: PJM/DOM detection.rank and detection.overnight_growth_pct, numbers.md 2.3. Utility, parent and ticker: api/facilities.json, hand-traced from the serving utility outward, never inferred from the state.

IF ASKED whether this is tradeable: &#39;It is an input to a trade, not a trade. A third of the load we found sits on public power and cooperatives with no listed equity at all, that number is on the screen, and we have run no backtest and don&#39;t claim one.&#39;

TWO-HOUR LAG: EIA-930 publishes with roughly a two hour delay. That is the reason the last line of the chain matters - the event is public before the company discusses it.">
